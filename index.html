<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>員工打卡系統</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      padding: 30px 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    h1 {
      margin: 0 0 25px;
      font-size: 28px;
    }

    #userName {
      font-size: 18px;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    .in {
      background: #06c755;
      color: #fff;
    }

    .out {
      background: #333;
      color: #fff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #status {
      margin-top: 20px;
      line-height: 1.6;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>員工打卡系統</h1>

      <div id="userName">正在連接 LINE...</div>

      <button class="in" id="clockIn" onclick="clock('in')" disabled>
        上班打卡
      </button>

      <button class="out" id="clockOut" onclick="clock('out')" disabled>
        下班打卡
      </button>

      <div id="status"></div>
    </div>
  </div>

  <script>
    const LIFF_ID = "2011676972-K4eAdKbi";

    let userData = {
      name: "",
      userId: "",
      latitude: "",
      longitude: ""
    };

    async function initializeLiff() {
      const userName = document.getElementById("userName");
      const status = document.getElementById("status");

      try {
        userName.innerText = "正在初始化 LINE...";

        if (typeof liff === "undefined") {
          throw new Error("LIFF SDK 沒有成功載入");
        }

        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });

        status.innerText = "LIFF 初始化成功";

        if (!liff.isLoggedIn()) {
          status.innerText = "正在登入 LINE...";
          liff.login();
          return;
        }

        status.innerText = "正在讀取 LINE 使用者資料...";

        const profile = await liff.getProfile();

        userData.name = profile.displayName;
        userData.userId = profile.userId;

        userName.innerText = "你好，" + profile.displayName;
        status.innerText = "LINE 連線成功";

        document.getElementById("clockIn").disabled = false;
        document.getElementById("clockOut").disabled = false;
      } catch (error) {
        userName.innerText = "❌ LINE 連線失敗";
        status.innerHTML =
          "錯誤：" + escapeHtml(error && error.message ? error.message : String(error)) +
          "<br><br>目前網址：" + escapeHtml(window.location.href);
      }
    }

    function clock(type) {
      const status = document.getElementById("status");

      if (!navigator.geolocation) {
        status.innerText = "此裝置或瀏覽器不支援定位功能。";
        return;
      }

      status.innerText = "正在取得定位...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          userData.latitude = position.coords.latitude;
          userData.longitude = position.coords.longitude;

          status.innerText = "正在打卡...";

          const runner = google.script.run
            .withSuccessHandler(showResult)
            .withFailureHandler(showError);

          if (type === "in") {
            runner.clockIn(userData);
          } else {
            runner.clockOut(userData);
          }
        },
        function(error) {
          status.innerText =
            "無法取得定位，請允許位置權限。錯誤代碼：" + error.code;
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function showResult(result) {
      document.getElementById("status").innerHTML =
        "✅ " + escapeHtml(result.type) + "打卡成功<br>" +
        escapeHtml(result.date) + " " + escapeHtml(result.time);
    }

    function showError(error) {
      document.getElementById("status").innerText =
        "打卡失敗：" + (error && error.message ? error.message : String(error));
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    initializeLiff();
  </script>
</body>
</html>
