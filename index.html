<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>員工打卡系統</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body{margin:0;padding:28px 18px;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2328}
.card{max-width:460px;margin:auto;background:#fff;border-radius:22px;padding:28px 22px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{text-align:center;margin:0 0 22px}.center{text-align:center}#userName{font-size:18px;font-weight:700}#status{color:#666;line-height:1.6;min-height:52px;margin:8px 0 20px}
button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:12px;font-size:18px;font-weight:700}
#clockIn{background:#06c755;color:#fff}#clockOut{background:#333;color:#fff}button:disabled{opacity:.45}
</style>
</head>
<body>
<main class="card">
<h1>員工打卡系統</h1>
<div id="userName" class="center">正在連接 LINE...</div>
<div id="status" class="center">請稍候</div>
<button id="clockIn" disabled>上班打卡</button>
<button id="clockOut" disabled>下班打卡</button>
</main>
<script>
const LIFF_ID="2011676972-K4eAdKbi";
const API_URL="https://script.google.com/macros/s/AKfycbzcI4tQHr82OOTHQNK5yhpamHaixRNz4CG84aikgqIbLtI1ZF3bLQiTkvvsLkl54m7O/exec";
const userData={name:"",userId:""};
let sending=false;
const userName=document.getElementById("userName"),statusEl=document.getElementById("status"),clockInBtn=document.getElementById("clockIn"),clockOutBtn=document.getElementById("clockOut");
function setButtons(v){clockInBtn.disabled=!v;clockOutBtn.disabled=!v}
async function initializeLiff(){
 try{
  if(typeof liff==="undefined")throw new Error("LIFF SDK 沒有成功載入");
  statusEl.textContent="正在初始化 LINE...";
  await liff.init({liffId:LIFF_ID});
  if(!liff.isLoggedIn()){statusEl.textContent="正在登入 LINE...";liff.login();return}
  statusEl.textContent="正在讀取 LINE 使用者資料...";
  const p=await liff.getProfile();
  userData.name=p.displayName;userData.userId=p.userId;
  userName.textContent="你好，"+p.displayName;
  statusEl.textContent="LINE 連線成功，可以打卡";setButtons(true);
 }catch(e){userName.textContent="LINE 連線失敗";statusEl.textContent="錯誤："+(e.message||e)}
}
function getPosition(){
 return new Promise((resolve,reject)=>{
  if(!navigator.geolocation){reject(new Error("此裝置不支援定位"));return}
  navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:15000,maximumAge:0});
 });
}
async function clock(type){
 if(sending)return;sending=true;setButtons(false);statusEl.textContent="正在取得定位...";
 try{
  const p=await getPosition();
  const payload={name:userData.name,userId:userData.userId,type,latitude:p.coords.latitude,longitude:p.coords.longitude};
  statusEl.textContent="正在送出"+type+"打卡...";
  await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  statusEl.textContent="✅ "+type+"打卡已送出，請到試算表確認紀錄";
 }catch(e){
  let m=e.message||String(e);
  if(typeof e.code==="number"){if(e.code===1)m="定位權限被拒絕，請允許 LINE 使用定位";if(e.code===2)m="目前無法取得定位，請確認定位服務與網路";if(e.code===3)m="取得定位逾時，請再試一次"}
  statusEl.textContent="❌ 打卡失敗："+m;
 }finally{sending=false;setButtons(true)}
}
clockInBtn.addEventListener("click",()=>clock("上班"));
clockOutBtn.addEventListener("click",()=>clock("下班"));
initializeLiff();
</script>
</body>
</html>
